name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stage1-smoke-test:
    # Small chromosome-arm subset smoke test per docs/BUILD_PLAN.md §5 (CI row): full-genome
    # PRS-CSx/LDpred2 runs are too heavy for CI and are run manually/on-demand. This job only
    # exercises Stage 1 (1000 Genomes download + QC) on chr22, the smallest autosome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install plink2 (no sudo, static binary)
        run: python3 scripts/verify_tools.py --install

      - name: Download chr22 smoke-test subset
        run: |
          python3 src/shared_stage1_1000g_download_qc/download.py --chromosomes 22

      - name: Run Stage 1 QC pipeline
        run: |
          export PATH="$PWD/tools/plink2:$PATH"
          python3 src/shared_stage1_1000g_download_qc/qc.py \
            --vcf-dir data/1000genomes/vcf \
            --panel data/1000genomes/metadata/integrated_call_samples_v3.20130502.ALL.panel \
            --chromosomes 22 \
            --out-dir data/processed/1000g_qc

      - name: Verify QC output exists
        run: |
          test -s data/processed/1000g_qc/1000g_qc.pgen
          test -s data/processed/1000g_qc/1000g_qc.pvar
          test -s data/processed/1000g_qc/1000g_qc.psam
